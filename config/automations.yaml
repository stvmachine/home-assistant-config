- id: '1788925616'
  alias: TV YouTube wake
  description: Wake the living room TV at 6am and play a YouTube video
  triggers:
  - trigger: time
    at: 06:00:00
  actions:
  - action: media_player.turn_on
    target:
      entity_id: media_player.living_room_tv_atv
  - delay: 00:00:05
  - action: media_player.play_media
    target:
      entity_id: media_player.living_room_tv_atv
    data:
      media_content_type: url
      media_content_id: https://www.youtube.com/watch?v=LklFaupGn2k
  mode: single
